name: reviser
services:
  api-service:
    build: .
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
    - mongoDB
    - minio
  
  file-processor:
    build: 
      context: .
      dockerfile: Dockerfile.minio-poller
    env_file:
      - .env
    depends_on:
    - mongoDB
    - minio

  mongoDB:
    image: mongo:noble
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  minio:
    image: quay.io/minio/minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do sleep 2; done;
      mc mb local/${S3_BUCKET_NAME} --ignore-existing;
      exit 0;
      "
volumes:
  minio_data:
  mongo_data: